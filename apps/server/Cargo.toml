[package]
name = "devhatch-server"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
argon2 = "0.5"
crc32fast = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
indexmap = "2"
libc = "0.2"
path-clean = "1"
password-hash = { version = "0.5", features = ["getrandom"] }
portable-pty = "0.9"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
skillink = { path = "../../crates/skillink" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
